# Publish a release that BRAT and Obsidian can install from: push a tag equal
# to the version in manifest.json (no "v" prefix), e.g. `git tag 0.2.0`.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Check that the tag matches the plugin version
        run: |
          manifest=$(jq -r .version manifest.json)
          package=$(jq -r .version package.json)
          if [[ "$GITHUB_REF_NAME" != "$manifest" || "$GITHUB_REF_NAME" != "$package" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, manifest.json $manifest and package.json $package must be equal"
            exit 1
          fi

      - run: bun test
      - run: bun run check
      - run: bun run build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
